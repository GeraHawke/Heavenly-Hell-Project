<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Heavenly Hell</title>

    <!-- ==================================================
         FUENTES
         ================================================== -->

    <!-- Saira -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Clash Display -->
    <link
        href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==================================================
           VARIABLES
           ================================================== */

        :root {
            --rojisima: #D61F3A;
            --bluetech: #4FA9C6;
            --dark: #111C20;
            --white: #E8E6E3;
        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
           ================================================== */

        body {
            min-height: 100vh;
            background: var(--bluetech);
            color: var(--dark);
            font-family: "Saira", sans-serif;
            overflow: hidden;
        }


        /* ==================================================
           MENÚ PRINCIPAL
           ================================================== */

        .menu {
            width: 100%;
            height: 100vh;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ==================================================
           CONTENIDO CENTRAL
           ================================================== */

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;

            /* Un poco hacia arriba para dejar aire abajo */
            transform: translateY(-30px);
        }


        /* ==================================================
           TÍTULO
           ================================================== */

        .title {
            font-family: "Clash Display", sans-serif;
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 600;

            letter-spacing: -0.045em;
            line-height: 0.9;

            color: var(--rojisima);
            text-align: center;

            user-select: none;
        }


        /* ==================================================
           SUBTÍTULO
           ================================================== */

        .subtitle {
            margin-top: 18px;

            font-size: 1rem;
            font-weight: 500;

            letter-spacing: 0.25em;
            text-transform: uppercase;

            opacity: 0.75;
        }


        /* ==================================================
           CONTROLES PRINCIPALES
           ================================================== */

        .controls {
            margin-top: 40px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 24px;
        }


        /* ==================================================
           SWITCH HEAVENLY HELL
           ================================================== */

        .heaven-toggle {
            display: flex;
            align-items: center;

            gap: 14px;

            font-size: 1rem;
            font-weight: 600;

            letter-spacing: 0.05em;
        }


        .switch {
            position: relative;

            width: 58px;
            height: 32px;

            display: inline-block;
        }


        .switch input {
            opacity: 0;

            width: 0;
            height: 0;
        }


        .slider {
            position: absolute;
            inset: 0;

            background: rgba(17, 28, 32, 0.25);

            border: 2px solid var(--dark);
            border-radius: 999px;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .slider::before {
            content: "";

            position: absolute;

            width: 22px;
            height: 22px;

            left: 3px;
            top: 3px;

            background: var(--dark);

            border-radius: 50%;

            transition: 0.25s ease;
        }


        .switch input:checked + .slider {
            background: var(--rojisima);
            border-color: var(--rojisima);
        }


        .switch input:checked + .slider::before {
            transform: translateX(26px);

            background: var(--white);
        }


        /* ==================================================
           BOTÓN INICIAR
           ================================================== */

        .start-button {
            border: 2px solid var(--dark);

            background: var(--dark);
            color: var(--white);

            padding: 13px 42px;

            border-radius: 999px;

            font-family: "Saira", sans-serif;
            font-size: 1rem;
            font-weight: 700;

            letter-spacing: 0.12em;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }


        .start-button:hover {
            background: var(--rojisima);
            border-color: var(--rojisima);

            transform: translateY(-2px);
        }


        .start-button:active {
            transform: translateY(1px);
        }


        /* ==================================================
           PROMOCIÓN ROJÍSIMA
           ================================================== */

        .promo {
            position: fixed;

            right: 34px;
            bottom: 28px;

            width: 300px;

            text-align: center;

            font-size: 0.78rem;
            line-height: 1.35;
        }


        .promo-title {
            color: var(--rojisima);

            font-family: "Clash Display", sans-serif;

            font-size: 1.15rem;
            font-weight: 600;

            letter-spacing: 0.02em;
        }


        .promo-preorder {
            margin-top: 2px;

            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }


        .promo-soundtrack {
            margin-top: 10px;

            opacity: 0.75;
        }


        /* ==================================================
           REPRODUCTOR
           ================================================== */

        .audio-player {
            margin-top: 9px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 7px;
        }


        /* ==================================================
           FILA PRINCIPAL DEL REPRODUCTOR
           ================================================== */

        .audio-main {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;
        }


        /* ==================================================
           BOTÓN PLAY / PAUSE
           ================================================== */

        .play-button {
            width: 32px;
            height: 32px;

            flex-shrink: 0;

            border: 2px solid var(--dark);
            border-radius: 50%;

            background: transparent;
            color: var(--dark);

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            font-family: "Saira", sans-serif;
            font-size: 0.75rem;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }


        .play-button:hover {
            background: var(--dark);
            color: var(--white);

            transform: scale(1.05);
        }


        /* ==================================================
           BARRA DE PROGRESO
           ================================================== */

        .progress-container {
            width: 170px;
            height: 6px;

            position: relative;

            display: flex;
            align-items: center;

            cursor: pointer;
        }


        .progress-background {
            width: 100%;
            height: 4px;

            background: rgba(17, 28, 32, 0.25);

            border-radius: 999px;

            overflow: hidden;
        }


        .progress-fill {
            width: 0%;
            height: 100%;

            background: var(--dark);

            border-radius: 999px;

            transition: width 0.05s linear;
        }


        /* ==================================================
           TIEMPO
           ================================================== */

        .track-time {
            min-width: 76px;

            font-size: 0.68rem;

            font-variant-numeric: tabular-nums;

            opacity: 0.65;

            text-align: left;
        }


        /* ==================================================
           BOTONES RESTART / STOP
           ================================================== */

        .audio-secondary {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;
        }


        .audio-secondary button {
            border: 1px solid rgba(17, 28, 32, 0.65);

            background: transparent;
            color: var(--dark);

            padding: 4px 12px;

            border-radius: 999px;

            font-family: "Saira", sans-serif;
            font-size: 0.62rem;
            font-weight: 600;

            letter-spacing: 0.08em;
            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }


        .audio-secondary button:hover {
            background: var(--dark);
            color: var(--white);

            transform: translateY(-1px);
        }


        .audio-secondary button:active {
            transform: translateY(1px);
        }


        /* ==================================================
           NOMBRE DEL TRACK
           ================================================== */

        .track-name {
            margin-top: 5px;

            font-size: 0.68rem;

            opacity: 0.5;

            text-align: center;
        }


        /* ==================================================
           VERSIÓN DEL PROTOTIPO
           ================================================== */

        .version {
            position: fixed;

            left: 28px;
            bottom: 22px;

            font-size: 0.7rem;

            letter-spacing: 0.1em;
            text-transform: uppercase;

            opacity: 0.45;
        }


        /* ==================================================
           TRANSICIÓN A GAME.HTML
           ================================================== */

        .transition-overlay {
            position: fixed;

            inset: 0;

            background: #000000;

            opacity: 0;

            pointer-events: none;

            z-index: 9999;

            transition: opacity 2s ease;
        }


        .transition-overlay.active {
            opacity: 1;

            pointer-events: all;
        }


        /* ==================================================
           RESPONSIVE
           ================================================== */

        @media (max-width: 700px) {

            .promo {
                right: 50%;

                transform: translateX(50%);

                bottom: 22px;

                width: 90vw;

                text-align: center;
            }


            .version {
                display: none;
            }
        }

    </style>
</head>


<body>

    <main class="menu">

        <!-- ==================================================
             CONTENIDO CENTRAL
             ================================================== -->

        <section class="center-content">

            <h1 class="title">
                HEAVENLY HELL
            </h1>


            <p class="subtitle">
                Adaptive Reactive Combat // Prototype
            </p>

            <p class="subtitle">
                ARC // P
            </p>


            <div class="controls">

                <!-- SWITCH -->

                <div class="heaven-toggle">

                    <span>
                        Heavenly Hell
                    </span>


                    <label class="switch">

                        <input
                            type="checkbox"
                            id="heavenlyHellToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <!-- INICIAR -->

                <button
                    class="start-button"
                    id="startButton"
                >
                    INICIAR
                </button>

            </div>

        </section>


        <!-- ==================================================
             PROMOCIÓN ROJÍSIMA
             ================================================== -->

        <aside class="promo">

            <div class="promo-title">
                Rojísima // REPRISE
            </div>


            <div class="promo-preorder">
                ¡Pre Ordena ahora!
            </div>


            <div class="promo-soundtrack">
                Escucha el soundtrack no oficial
            </div>


            <div class="audio-player">

                <!-- FILA PRINCIPAL -->

                <div class="audio-main">

                    <!-- PLAY / PAUSE -->

                    <button
                        class="play-button"
                        id="audioButton"
                        aria-label="Reproducir soundtrack"
                    >
                        ▶
                    </button>


                    <!-- BARRA -->

                    <div
                        class="progress-container"
                        id="progressContainer"
                        aria-label="Progreso de la canción"
                    >

                        <div class="progress-background">

                            <div
                                class="progress-fill"
                                id="progressFill"
                            ></div>

                        </div>

                    </div>


                    <!-- TIEMPO -->

                    <span
                        class="track-time"
                        id="trackTime"
                    >
                        0:00 / 0:00
                    </span>

                </div>


                <!-- RESTART / STOP -->

                <div class="audio-secondary">

                    <button
                        id="restartButton"
                    >
                        RESTART
                    </button>


                    <button
                        id="stopButton"
                    >
                        STOP
                    </button>

                </div>

            </div>


        </aside>


        <!-- ==================================================
             VERSIÓN
             ================================================== -->

        <div class="version">
            Heavenly Hell // Prototype 0.1
        </div>

    </main>


    <!-- ==================================================
         AUDIO
         ================================================== -->

    <audio
        id="repriseAudio"
        preload="auto"
    >

        <source
            src="../Recursos/Rojisima REPRISE.mp3"
            type="audio/mpeg"
        >

        Tu navegador no soporta audio HTML.

    </audio>


    <!-- ==================================================
         OVERLAY DE TRANSICIÓN
         ================================================== -->

    <div
        class="transition-overlay"
        id="transitionOverlay"
    ></div>


    <!-- ==================================================
         HEAVENLY HELL JS
         ================================================== -->

    <script src="../System/HeavenlyHell.js"></script>


    <!-- ==================================================
         MENÚ / AUDIO / TRANSICIÓN
         ================================================== -->

    <script>

        const audio =
            document.getElementById("repriseAudio");


        const audioButton =
            document.getElementById("audioButton");


        const progressContainer =
            document.getElementById("progressContainer");


        const progressFill =
            document.getElementById("progressFill");


        const trackTime =
            document.getElementById("trackTime");


        const restartButton =
            document.getElementById("restartButton");


        const stopButton =
            document.getElementById("stopButton");


        const startButton =
            document.getElementById("startButton");


        const transitionOverlay =
            document.getElementById("transitionOverlay");


        let isTransitioning = false;


        /* ==================================================
           FORMATO DE TIEMPO
           ================================================== */

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) {
                return "0:00";
            }


            const minutes =
                Math.floor(seconds / 60);


            const remainingSeconds =
                Math.floor(seconds % 60);


            return `${minutes}:${remainingSeconds
                .toString()
                .padStart(2, "0")}`;
        }


        /* ==================================================
           ACTUALIZAR BARRA
           ================================================== */

        function updateProgress() {

            if (!audio.duration) {
                return;
            }


            const percentage =
                (audio.currentTime / audio.duration) * 100;


            progressFill.style.width =
                `${percentage}%`;


            trackTime.textContent =
                `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }


        /* ==================================================
           PLAY / PAUSE
           ================================================== */

        audioButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();


                if (audio.paused) {

                    audio.play()
                        .then(() => {

                            audioButton.textContent = "Ⅱ";

                            audioButton.setAttribute(
                                "aria-label",
                                "Pausar soundtrack"
                            );

                        })
                        .catch(() => {

                            console.log(
                                "No se pudo reproducir el audio."
                            );

                        });

                } else {

                    audio.pause();

                    audioButton.textContent = "▶";

                    audioButton.setAttribute(
                        "aria-label",
                        "Reproducir soundtrack"
                    );
                }
            }
        );


        /* ==================================================
           RESTART
           ================================================== */

        restartButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();


                audio.currentTime = 0;


                audio.play()
                    .then(() => {

                        audioButton.textContent = "Ⅱ";

                        audioButton.setAttribute(
                            "aria-label",
                            "Pausar soundtrack"
                        );

                        updateProgress();

                    })
                    .catch(() => {

                        audioButton.textContent = "▶";

                    });

            }
        );


        /* ==================================================
           STOP
           ================================================== */

        stopButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();


                audio.pause();

                audio.currentTime = 0;

                progressFill.style.width = "0%";


                audioButton.textContent = "▶";

                audioButton.setAttribute(
                    "aria-label",
                    "Reproducir soundtrack"
                );


                trackTime.textContent =
                    `0:00 / ${formatTime(audio.duration)}`;

            }
        );


        /* ==================================================
           ACTUALIZACIÓN DEL TIEMPO
           ================================================== */

        audio.addEventListener(
            "timeupdate",
            updateProgress
        );


        /* ==================================================
           CARGA DE DURACIÓN
           ================================================== */

        audio.addEventListener(
            "loadedmetadata",
            updateProgress
        );


        /* ==================================================
           CLICK EN LA BARRA
           ================================================== */

        progressContainer.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();


                if (!audio.duration) {
                    return;
                }


                const rectangle =
                    progressContainer.getBoundingClientRect();


                const clickPosition =
                    event.clientX - rectangle.left;


                const percentage =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            clickPosition / rectangle.width
                        )
                    );


                audio.currentTime =
                    audio.duration * percentage;


                updateProgress();

            }
        );


        /* ==================================================
           CUANDO TERMINA LA CANCIÓN
           ================================================== */

        audio.addEventListener(
            "ended",
            () => {

                audioButton.textContent = "▶";


                audioButton.setAttribute(
                    "aria-label",
                    "Reproducir soundtrack"
                );


                progressFill.style.width = "0%";


                trackTime.textContent =
                    `0:00 / ${formatTime(audio.duration)}`;

            }
        );


        /* ==================================================
           TRANSICIÓN A GAME.HTML
           ================================================== */

        startButton.addEventListener(
            "click",
            async () => {

                if (isTransitioning) {
                    return;
                }


                isTransitioning = true;


                /* Deshabilitar botón */

                startButton.disabled = true;

                startButton.style.cursor =
                    "default";


                /* Comenzar fade visual */

                transitionOverlay.classList.add(
                    "active"
                );


                /* Fade de audio */

                const startVolume =
                    audio.volume;


                const fadeDuration =
                    2000;


                const fadeStart =
                    performance.now();


                function fadeAudio(currentTime) {

                    const elapsed =
                        currentTime - fadeStart;


                    const progress =
                        Math.min(
                            elapsed / fadeDuration,
                            1
                        );


                    audio.volume =
                        startVolume * (1 - progress);


                    if (progress < 1) {

                        requestAnimationFrame(
                            fadeAudio
                        );

                    } else {

                        audio.pause();

                        audio.volume = 1;

                    }
                }


                requestAnimationFrame(
                    fadeAudio
                );


                /* Esperar los 2 segundos */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            2000
                        )
                );


                /* Ir al juego */

                window.location.href =
                    "Game.html";

            }
        );

    </script>

</body>
</html>
