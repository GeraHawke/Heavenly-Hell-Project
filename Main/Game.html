<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Heavenly Hell // Game</title>


    <!-- ==================================================
         FUENTES
         ================================================== -->

    <!-- Saira -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Clash Display -->
    <link
        href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==================================================
           VARIABLES
           ================================================== */

        :root {
            --rojisima: #D61F3A;
            --bluetech: #4FA9C6;
            --dark: #111C20;
            --white: #E8E6E3;
        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
           ================================================== */

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bluetech);
            font-family: "Saira", sans-serif;
            color: var(--dark);
        }


        /* ==================================================
           PANTALLA DEL JUEGO

           Es solamente la ventana que vemos.
           El mundo real vive dentro de #world.
           ================================================== */

        .game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* ==================================================
           MUNDO

           El mundo es más grande que la pantalla.
           La cámara mueve visualmente este elemento.
           ================================================== */

        #world {
            position: absolute;
            left: 0;
            top: 0;

            width: 3000px;
            height: 3000px;

            background: var(--bluetech);

            transform-origin: 0 0;
            will-change: transform;
        }


        /* ==================================================
           GRID DEL MUNDO
           ================================================== */

        #worldGrid {
            position: absolute;
            left: 0;
            top: 0;

            width: 3000px;
            height: 3000px;

            z-index: 0;
            pointer-events: none;
        }


        /* ==================================================
           PUNTO DE SPAWN

           Temporalmente visible para saber dónde está
           el centro original del mundo.
           ================================================== */

        .spawn-marker {
            position: absolute;

            width: 20px;
            height: 20px;

            border: 3px solid var(--rojisima);
            border-radius: 50%;

            transform: translate(-50%, -50%);

            z-index: 1;
            pointer-events: none;
        }


        /* ==================================================
           COBERTURA
           ================================================== */

        .cover-block {
            position: absolute;

            background: var(--dark);

            border: 2px solid rgba(232, 230, 227, 0.25);

            box-shadow:
                0 6px 0 rgba(17, 28, 32, 0.18);

            z-index: 2;

            pointer-events: none;
        }


        /* ==================================================
           CELDA DE COBERTURA
           ================================================== */

        .cover-cell {
            position: absolute;

            width: 50px;
            height: 50px;

            background: var(--dark);

            border: 2px solid rgba(232, 230, 227, 0.25);

            box-shadow:
                inset 0 0 0 1px rgba(232, 230, 227, 0.05),
                0 5px 0 rgba(17, 28, 32, 0.18);
        }


        /* ==================================================
           PERSONAJE
           ================================================== */

        .player {
            z-index: 3;
        }


        /* ==================================================
           UI

           La UI está FUERA de #world.
           Por eso la cámara nunca la moverá.
           ================================================== */

        .prototype-label,
        .prototype-state,
        .back-button {
            z-index: 10;
        }


        /* ==================================================
           INFORMACIÓN
           ================================================== */

        .prototype-label {
            position: absolute;

            top: 24px;
            left: 28px;

            font-family: "Clash Display", sans-serif;

            font-size: 1.2rem;
            font-weight: 600;

            color: var(--rojisima);

            letter-spacing: 0.03em;
        }


        .prototype-state {
            position: absolute;

            top: 55px;
            left: 29px;

            font-size: 0.75rem;

            letter-spacing: 0.1em;
            text-transform: uppercase;

            opacity: 0.55;
        }


        /* ==================================================
           BOTÓN MENÚ
           ================================================== */

        .back-button {
            position: absolute;

            top: 24px;
            right: 28px;

            border: 2px solid var(--dark);

            background: transparent;
            color: var(--dark);

            padding: 7px 18px;

            border-radius: 999px;

            font-family: "Saira", sans-serif;

            font-size: 0.75rem;
            font-weight: 600;

            letter-spacing: 0.08em;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }


        .back-button:hover {
            background: var(--dark);
            color: var(--white);
        }


        .back-button:active {
            transform: translateY(1px);
        }


        .back-button:disabled {
            opacity: 0.5;
            cursor: default;
        }


        /* ==================================================
           TRANSICIÓN
           ================================================== */

        .transition-overlay {
            position: fixed;

            inset: 0;

            background: #000000;

            opacity: 0;

            pointer-events: none;

            z-index: 9999;

            transition: opacity 2s ease;
        }


        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

    </style>

</head>


<body>


    <!-- ==================================================
         JUEGO
         ================================================== -->

    <main
        class="game"
        id="game"
    >


        <!-- ==================================================
             MUNDO
             ================================================== -->

        <div id="world">

            <!-- Grid -->
            <canvas id="worldGrid"></canvas>


            <!-- Marcador temporal de spawn -->
            <div
                class="spawn-marker"
                id="spawnMarker"
            ></div>

        </div>


        <!-- ==================================================
             UI
             ================================================== -->

        <div class="prototype-label">
            HEAVENLY HELL
        </div>


        <div class="prototype-state">
            Prototype // Player Test
        </div>


        <button
            class="back-button"
            id="backButton"
        >
            MENÚ
        </button>

    </main>


    <!-- ==================================================
         TRANSICIÓN / NAVEGACIÓN
         ================================================== -->

    <div
        class="transition-overlay"
        id="transitionOverlay"
    ></div>


    <!-- ==================================================
         SISTEMA DEL MUNDO

         Primero construimos el mundo.
         Rojisima.js se carga después.
         ================================================== -->

    <script>

        /* ==================================================
           ELEMENTOS PRINCIPALES
           ================================================== */

        const game =
            document.getElementById("game");

        const world =
            document.getElementById("world");

        const gridCanvas =
            document.getElementById("worldGrid");

        const gridContext =
            gridCanvas.getContext("2d");


        /* ==================================================
           TAMAÑO DEL MUNDO

           Por ahora seguimos usando 3000 x 3000.
           El mundo infinito será una milestone posterior.
           ================================================== */

        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 3000;


        /* ==================================================
           SPAWN DEL JUGADOR
           ================================================== */

        const PLAYER_SPAWN_X =
            WORLD_WIDTH / 2;

        const PLAYER_SPAWN_Y =
            WORLD_HEIGHT / 2;


        /* ==================================================
           EXPONER DATOS

           Rojisima.js puede acceder a estos valores
           mediante window.
           ================================================== */

        window.WORLD_WIDTH =
            WORLD_WIDTH;

        window.WORLD_HEIGHT =
            WORLD_HEIGHT;

        window.PLAYER_SPAWN_X =
            PLAYER_SPAWN_X;

        window.PLAYER_SPAWN_Y =
            PLAYER_SPAWN_Y;


        /* ==================================================
           CONFIGURAR MUNDO
           ================================================== */

        world.style.width =
            `${WORLD_WIDTH}px`;

        world.style.height =
            `${WORLD_HEIGHT}px`;


        /* ==================================================
           GRID
           ================================================== */

        const GRID_SIZE = 50;

        const GRID_COLOR = "#111C20";

        const GRID_OPACITY = 0.14;


        /* Exponer tamaño del grid */

        window.GRID_SIZE =
            GRID_SIZE;


        /* ==================================================
           PREPARAR GRID
           ================================================== */

        function resizeGrid() {

            const devicePixelRatio =
                window.devicePixelRatio || 1;


            gridCanvas.width =
                WORLD_WIDTH *
                devicePixelRatio;

            gridCanvas.height =
                WORLD_HEIGHT *
                devicePixelRatio;


            gridCanvas.style.width =
                `${WORLD_WIDTH}px`;

            gridCanvas.style.height =
                `${WORLD_HEIGHT}px`;


            gridContext.setTransform(
                devicePixelRatio,
                0,
                0,
                devicePixelRatio,
                0,
                0
            );


            drawGrid();
        }


        /* ==================================================
           DIBUJAR GRID
           ================================================== */

        function drawGrid() {

            gridContext.clearRect(
                0,
                0,
                WORLD_WIDTH,
                WORLD_HEIGHT
            );


            gridContext.strokeStyle =
                GRID_COLOR;

            gridContext.globalAlpha =
                GRID_OPACITY;

            gridContext.lineWidth = 1;


            /* Líneas verticales */

            for (
                let x = 0;
                x <= WORLD_WIDTH;
                x += GRID_SIZE
            ) {

                gridContext.beginPath();

                gridContext.moveTo(
                    x + 0.5,
                    0
                );

                gridContext.lineTo(
                    x + 0.5,
                    WORLD_HEIGHT
                );

                gridContext.stroke();
            }


            /* Líneas horizontales */

            for (
                let y = 0;
                y <= WORLD_HEIGHT;
                y += GRID_SIZE
            ) {

                gridContext.beginPath();

                gridContext.moveTo(
                    0,
                    y + 0.5
                );

                gridContext.lineTo(
                    WORLD_WIDTH,
                    y + 0.5
                );

                gridContext.stroke();
            }


            gridContext.globalAlpha = 1;
        }


        resizeGrid();


        /* ==================================================
           MARCADOR DE SPAWN
           ================================================== */

        const spawnMarker =
            document.getElementById(
                "spawnMarker"
            );


        spawnMarker.style.left =
            `${PLAYER_SPAWN_X}px`;


        spawnMarker.style.top =
            `${PLAYER_SPAWN_Y}px`;


        /* ==================================================
           CONFIGURACIÓN DE COBERTURA
           ================================================== */

        const COVER_CONFIG = {

            cantidad: 8,

            distanciaSpawn: 250,

            distanciaMinima: 150,

            radioSpawnX: 850,

            radioSpawnY: 550,

            maxIntentos: 100
        };


        /* ==================================================
           FORMAS DE COBERTURA
           ================================================== */

        const COVER_SHAPES = [

            /* Cuadrado */

            [
                [0, 0],
                [1, 0],
                [0, 1],
                [1, 1]
            ],


            /* Línea horizontal */

            [
                [0, 0],
                [1, 0],
                [2, 0]
            ],


            /* Línea vertical */

            [
                [0, 0],
                [0, 1],
                [0, 2]
            ],


            /* L */

            [
                [0, 0],
                [0, 1],
                [1, 1]
            ],


            /* L invertida */

            [
                [1, 0],
                [1, 1],
                [0, 1]
            ],


            /* T */

            [
                [0, 0],
                [1, 0],
                [2, 0],
                [1, 1]
            ],


            /* S */

            [
                [1, 0],
                [2, 0],
                [0, 1],
                [1, 1]
            ],


            /* Zigzag */

            [
                [0, 0],
                [1, 0],
                [1, 1],
                [2, 1]
            ]

        ];


        /* ==================================================
           LISTA DE COBERTURA
           ================================================== */

        const coverBlocks = [];

        window.coverBlocks =
            coverBlocks;


        /* ==================================================
           RANDOM
           ================================================== */

        function randomInteger(
            min,
            max
        ) {

            return Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min;
        }


        /* ==================================================
           DISTANCIA
           ================================================== */

        function getDistance(
            x1,
            y1,
            x2,
            y2
        ) {

            const dx =
                x2 - x1;

            const dy =
                y2 - y1;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );
        }


        /* ==================================================
           OBTENER FORMA ALEATORIA
           ================================================== */

        function getRandomCoverShape() {

            const index =
                randomInteger(
                    0,
                    COVER_SHAPES.length - 1
                );


            return COVER_SHAPES[index];
        }


        /* ==================================================
           CREAR DATOS DE UNA FORMACIÓN
           ================================================== */

        function createCoverBlock() {

            const shape =
                getRandomCoverShape();


            /* Determinar tamaño */

            let maxCellX = 0;
            let maxCellY = 0;


            for (
                const cell of shape
            ) {

                maxCellX =
                    Math.max(
                        maxCellX,
                        cell[0]
                    );


                maxCellY =
                    Math.max(
                        maxCellY,
                        cell[1]
                    );
            }


            const width =
                (maxCellX + 1) *
                GRID_SIZE;


            const height =
                (maxCellY + 1) *
                GRID_SIZE;


            /*
                Elegimos coordenadas de grid.

                Esto mantiene todas las coberturas
                alineadas al mismo lenguaje espacial.
            */

            const minGridX =
                Math.floor(
                    Math.max(
                        100,
                        PLAYER_SPAWN_X -
                        COVER_CONFIG.radioSpawnX
                    ) / GRID_SIZE
                );


            const maxGridX =
                Math.floor(
                    Math.min(
                        WORLD_WIDTH -
                        width -
                        100,

                        PLAYER_SPAWN_X +
                        COVER_CONFIG.radioSpawnX
                    ) / GRID_SIZE
                );


            const minGridY =
                Math.floor(
                    Math.max(
                        100,
                        PLAYER_SPAWN_Y -
                        COVER_CONFIG.radioSpawnY
                    ) / GRID_SIZE
                );


            const maxGridY =
                Math.floor(
                    Math.min(
                        WORLD_HEIGHT -
                        height -
                        100,

                        PLAYER_SPAWN_Y +
                        COVER_CONFIG.radioSpawnY
                    ) / GRID_SIZE
                );


            const gridX =
                randomInteger(
                    minGridX,
                    maxGridX
                );


            const gridY =
                randomInteger(
                    minGridY,
                    maxGridY
                );


            const x =
                gridX * GRID_SIZE;


            const y =
                gridY * GRID_SIZE;


            return {

                element: null,

                x: x,

                y: y,

                width: width,

                height: height,

                cells: shape
            };
        }


        /* ==================================================
           COMPROBAR SI UNA FORMACIÓN PUEDE COLOCARSE
           ================================================== */

        function canPlaceCover(
            newBlock
        ) {

            /* Centro de la nueva formación */

            const newCenterX =
                newBlock.x +
                newBlock.width / 2;


            const newCenterY =
                newBlock.y +
                newBlock.height / 2;


            /* Mantener libre el spawn */

            const distanceToSpawn =
                getDistance(
                    PLAYER_SPAWN_X,
                    PLAYER_SPAWN_Y,
                    newCenterX,
                    newCenterY
                );


            if (
                distanceToSpawn <
                COVER_CONFIG.distanciaSpawn
            ) {

                return false;
            }


            /* Separar formaciones */

            for (
                const block of coverBlocks
            ) {

                const blockCenterX =
                    block.x +
                    block.width / 2;


                const blockCenterY =
                    block.y +
                    block.height / 2;


                const distance =
                    getDistance(
                        newCenterX,
                        newCenterY,
                        blockCenterX,
                        blockCenterY
                    );


                if (
                    distance <
                    COVER_CONFIG.distanciaMinima
                ) {

                    return false;
                }
            }


            return true;
        }


        /* ==================================================
           CREAR ELEMENTO VISUAL
           ================================================== */

        function createCoverElement(
            block
        ) {

            const element =
                document.createElement("div");


            element.className =
                "cover-block";


            element.style.left =
                `${block.x}px`;


            element.style.top =
                `${block.y}px`;


            element.style.width =
                `${block.width}px`;


            element.style.height =
                `${block.height}px`;


            /* Crear cada celda */

            for (
                const cell of block.cells
            ) {

                const cellElement =
                    document.createElement(
                        "div"
                    );


                cellElement.className =
                    "cover-cell";


                cellElement.style.left =
                    `${cell[0] * GRID_SIZE}px`;


                cellElement.style.top =
                    `${cell[1] * GRID_SIZE}px`;


                element.appendChild(
                    cellElement
                );
            }


            return element;
        }


        /* ==================================================
           GENERAR COBERTURA
           ================================================== */

        function generateCover() {

            coverBlocks.length = 0;


            /*
                Si regeneramos el escenario,
                eliminamos primero la cobertura anterior.
            */

            document
                .querySelectorAll(
                    ".cover-block"
                )
                .forEach(
                    element => {
                        element.remove();
                    }
                );


            /* Crear formaciones */

            for (
                let i = 0;
                i < COVER_CONFIG.cantidad;
                i++
            ) {

                let placed = false;


                for (
                    let attempt = 0;
                    attempt <
                    COVER_CONFIG.maxIntentos;
                    attempt++
                ) {

                    const block =
                        createCoverBlock();


                    if (
                        !canPlaceCover(
                            block
                        )
                    ) {

                        continue;
                    }


                    const element =
                        createCoverElement(
                            block
                        );


                    block.element =
                        element;


                    world.appendChild(
                        element
                    );


                    coverBlocks.push(
                        block
                    );


                    placed = true;

                    break;
                }


                if (!placed) {

                    console.warn(
                        "No se pudo colocar cobertura:",
                        i
                    );
                }
            }
        }


        /* ==================================================
           GENERAR MUNDO
           ================================================== */

        generateCover();


        /* ==================================================
           CÁMARA

           La cámara sigue a Rojísima.

           Rojísima mantiene su posición REAL dentro
           del mundo.

           La cámara solamente transforma #world para
           que Rojísima aparezca aproximadamente en
           el centro de la pantalla.
           ================================================== */

        function updateCamera() {

            /*
                Rojisima.js se carga después de este script.

                Por eso puede ocurrir que en los primeros
                frames todavía no exista .player.
            */

            const player =
                world.querySelector(
                    ".player"
                );


            if (!player) {
                return;
            }


            /*
                offsetLeft y offsetTop representan la
                posición del jugador DENTRO de #world.

                No usamos getBoundingClientRect()
                porque #world está siendo transformado
                por la propia cámara.
            */

            const playerX =
                player.offsetLeft +
                player.offsetWidth / 2;


            const playerY =
                player.offsetTop +
                player.offsetHeight / 2;


            /*
                Queremos que el jugador aparezca
                en el centro de la pantalla.
            */

            const cameraX =
                playerX -
                window.innerWidth / 2;


            const cameraY =
                playerY -
                window.innerHeight / 2;


            /*
                Movemos visualmente todo el mundo.

                Rojísima no se mueve al centro.

                El mundo se mueve alrededor de ella.
            */

            world.style.transform =
                `translate3d(
                    ${-cameraX}px,
                    ${-cameraY}px,
                    0
                )`;
        }


        /* ==================================================
           LOOP DE CÁMARA
           ================================================== */

        function cameraLoop() {

            updateCamera();

            requestAnimationFrame(
                cameraLoop
            );
        }


        cameraLoop();


        /* ==================================================
           INFORMACIÓN GLOBAL
           ================================================== */

        window.game =
            game;

        window.world =
            world;

        window.gridCanvas =
            gridCanvas;


        /* ==================================================
           RESIZE

           Ahora que existe cámara real, al cambiar
           el tamaño de la ventana simplemente redibujamos
           el grid y actualizamos la cámara.
           ================================================== */

        window.addEventListener(
            "resize",
            () => {

                resizeGrid();

                updateCamera();
            }
        );

    </script>


    <!-- ==================================================
         PROTAGONISTA

         Se carga DESPUÉS de que el mundo ya existe.

         El movimiento y la animación de Rojísima
         permanecen dentro de Rojisima.js.
         ================================================== -->

    <script
        src="../Characters/Rojisima.js"
    ></script>


    <!-- ==================================================
         SISTEMA HEAVENLY HELL
         ================================================== -->

    <script
        src="../System/HeavenlyHell.js"
    ></script>


    <!-- ==================================================
         TRANSICIÓN / NAVEGACIÓN
         ================================================== -->

    <script>

        const backButton =
            document.getElementById(
                "backButton"
            );


        const transitionOverlay =
            document.getElementById(
                "transitionOverlay"
            );


        let isTransitioning = false;


        backButton.addEventListener(
            "click",
            async () => {

                if (isTransitioning) {
                    return;
                }


                isTransitioning = true;

                backButton.disabled = true;


                transitionOverlay.classList.add(
                    "active"
                );


                await new Promise(
                    resolve => {

                        setTimeout(
                            resolve,
                            2000
                        );
                    }
                );


                window.location.href =
                    "Menu.html";
            }
        );

    </script>

</body>

</html>
