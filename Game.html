<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heavenly Hell // Game</title>

    <!-- Saira -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Clash Display -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojisima: #D61F3A;
            --bluetech: #4FA9C6;
            --dark: #111C20;
            --white: #E8E6E3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: var(--bluetech);

            font-family: "Saira", sans-serif;
            color: var(--dark);
        }

        /* --------------------------------------------------
           ARENA
        -------------------------------------------------- */

        .game {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --------------------------------------------------
           JUGADOR
        -------------------------------------------------- */

        .player {
            position: absolute;

            width: 48px;
            height: 64px;

            background: var(--rojisima);

            border: 3px solid var(--dark);

            border-radius: 50%;

            box-shadow:
                0 8px 0 rgba(17, 28, 32, 0.15);

            transform: translate(-50%, -50%);
        }

        /* --------------------------------------------------
           INFO TEMPORAL
        -------------------------------------------------- */

        .prototype-label {
            position: absolute;

            top: 24px;
            left: 28px;

            font-family: "Clash Display", sans-serif;

            font-size: 1.2rem;
            font-weight: 600;

            color: var(--rojisima);

            letter-spacing: 0.03em;
        }

        .prototype-state {
            position: absolute;

            top: 55px;
            left: 29px;

            font-size: 0.75rem;

            letter-spacing: 0.1em;
            text-transform: uppercase;

            opacity: 0.55;
        }

        .back-button {
            position: absolute;

            top: 24px;
            right: 28px;

            border: 2px solid var(--dark);

            background: transparent;
            color: var(--dark);

            padding: 7px 18px;

            border-radius: 999px;

            font-family: "Saira", sans-serif;
            font-size: 0.75rem;
            font-weight: 600;

            letter-spacing: 0.08em;

            cursor: pointer;

            transition: 0.15s ease;
        }

        .back-button:hover {
            background: var(--dark);
            color: var(--white);
        }
    </style>
</head>

<body>

    <main class="game">

        <div class="prototype-label">
            HEAVENLY HELL
        </div>

        <div class="prototype-state">
            Prototype // Player Test
        </div>

        <button
            class="back-button"
            id="backButton"
        >
            MENÚ
        </button>

        <!-- Nuestro humilde héroe -->
        <div
            class="player"
            id="player"
            aria-label="Jugador"
        ></div>

    </main>

    <script src="HeavenlyHell.js"></script>

    <script>
        document
            .getElementById("backButton")
            .addEventListener("click", () => {

                window.location.href = "Menu.html";

            });
    </script>

</body>
</html>
